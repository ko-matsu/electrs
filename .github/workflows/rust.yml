name: CI

on:
  push:
    branches:
      - main
      - master
      - new-index
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: setup
        run: sudo apt install -y libfuse2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      #- name: Check formatting
      #  run: cargo fmt -- --check

      - name: Setup Rust toolchain
        run: rustup default 1.75.0

      - name: Check for errors
        run: cargo check --all-targets

      - name: Tests (Bitcoin mode, REST+Electrum)
        run: RUST_LOG=debug cargo test

      - name: Test test_electrum_raw
        run: RUST_LOG=debug cargo test -- --include-ignored test_electrum_raw

      - name: Tests (Liquid mode, REST)
        run: RUST_LOG=debug cargo test --features liquid

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix build .
        continue-on-error: true
